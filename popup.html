<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资产仪表盘</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="dashboard">
    <section id="mainView">
      <header class="topbar">
        <div class="portfolio-summary">
          <h1>合:</h1>
          <strong id="totalValue">¥0.00</strong>
        </div>
        <button id="settingsButton" class="plain-button" type="button">设置</button>
      </header>

      <section class="asset-list" aria-label="资产明细">
        <div class="asset-header" aria-hidden="true">
          <span>Symbol</span>
          <span>Price</span>
        </div>
        <div id="assetRows"></div>
      </section>
    </section>

    <section id="settingsView" class="settings-view" hidden>
      <header class="topbar">
        <button id="backButton" class="plain-button" type="button">返回</button>
        <h1>设置</h1>
        <button id="refreshButton" class="plain-button" type="button">刷新价格</button>
      </header>

      <section class="settings-section">
        <h2>持有数量</h2>
        <div id="holdingRows" class="holding-list"></div>
      </section>

      <section class="settings-section">
        <h2>添加标的物</h2>
        <div class="asset-form">
          <select id="assetTypeSelect" aria-label="标的物类型">
            <option value="crypto">数字货币 · OKX</option>
            <option value="stock">美股 · Yahoo</option>
          </select>
          <input id="assetSymbolInput" type="text" maxlength="12" autocomplete="off" placeholder="代码，如 TRX / TSLA" aria-label="标的物代码">
          <button id="addAssetButton" class="plain-button" type="button">添加</button>
        </div>
        <div id="assetMessage" class="asset-message" role="status"></div>
        <div id="customAssetRows" class="custom-asset-list"></div>
      </section>

      <section class="settings-section">
        <h2>行情设置</h2>
        <div class="setting-row">
          <label for="priceCurrencySelect">标的物价格币种</label>
          <select id="priceCurrencySelect">
            <option value="USD">美元 USD</option>
            <option value="CNY">人民币 CNY</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="totalCurrencySelect">资产总额币种</label>
          <select id="totalCurrencySelect">
            <option value="CNY">人民币 CNY</option>
            <option value="USD">美元 USD</option>
          </select>
        </div>
        <div class="setting-row"><span>人民币汇率</span><strong id="exchangeRate">USD/CNY 7.20</strong></div>
        <div class="setting-row"><span>自动刷新</span><strong>每 5 分钟</strong></div>
        <div class="setting-row"><span>更新时间</span><strong id="updatedAt">尚未更新</strong></div>
        <div class="setting-row"><span>行情状态</span><strong id="statusText" role="status">正在获取…</strong></div>
      </section>

      <section class="settings-section source-section">
        <h2>价格来源</h2>
        <div class="source-row">
          <div><strong>加密货币</strong><span id="cryptoSourceSymbols">BTC、ADA、OKB、PAXG、BNB</span></div>
          <span>OKX · SPOT</span>
        </div>
        <div class="source-row">
          <div><strong>美股</strong><span id="stockSourceSymbols">AAPL、GOOGL、NVDA</span></div>
          <span>Yahoo Finance</span>
        </div>
        <div class="source-row">
          <div><strong>人民币汇率</strong><span>USD/CNY</span></div>
          <span>Yahoo Finance · CNY=X</span>
        </div>
      </section>
    </section>
  </main>

  <script src="portfolio.js"></script>
  <script src="popup.js"></script>
</body>
</html>
