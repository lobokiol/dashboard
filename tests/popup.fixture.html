<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资产仪表盘测试页</title>
  <link rel="stylesheet" href="../popup.css">
</head>
<body>
  <main class="dashboard">
    <section id="mainView">
      <header class="topbar">
        <div class="portfolio-summary">
          <h1>合:</h1>
          <strong id="totalValue">¥0.00</strong>
        </div>
        <div class="toolbar-actions">
          <button id="mainRefreshButton" class="plain-button icon-button" type="button" aria-label="刷新价格" title="刷新价格">🔄︎</button>
          <button id="settingsButton" class="plain-button icon-button" type="button" aria-label="设置" title="设置">⚙️</button>
        </div>
      </header>
      <section class="asset-list" aria-label="资产明细">
        <div class="asset-header" aria-hidden="true">
          <span>Symbol</span><span>Price</span>
        </div>
        <div id="assetRows"></div>
      </section>
      <p class="portfolio-note">　　耐心持有或持续dca，即持续复利，才可以赚到人生中，改变命运的财富。</p>
    </section>

    <section id="settingsView" class="settings-view" hidden>
      <header class="topbar">
        <button id="backButton" class="plain-button" type="button">返回</button>
        <h1>设置</h1>
        <button id="refreshButton" class="plain-button" type="button">刷新价格</button>
      </header>
      <section class="settings-section">
        <h2>持有数量</h2>
        <div id="holdingRows" class="holding-list"></div>
      </section>
      <section class="settings-section">
        <h2>添加标的物</h2>
        <div class="asset-form">
          <input id="assetSymbolInput" type="text" maxlength="12" autocomplete="off" placeholder="代码，如 TRX / TSLA" aria-label="标的物代码">
          <button id="addAssetButton" class="plain-button" type="button">添加</button>
        </div>
        <div id="assetMessage" class="asset-message" role="status"></div>
      </section>
      <section class="settings-section">
        <h2>行情设置</h2>
        <div class="setting-row">
          <label for="priceCurrencySelect">标的物价格币种</label>
          <select id="priceCurrencySelect">
            <option value="USD">美元 USD</option>
            <option value="CNY">人民币 CNY</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="totalCurrencySelect">资产总额币种</label>
          <select id="totalCurrencySelect">
            <option value="CNY">人民币 CNY</option>
            <option value="USD">美元 USD</option>
          </select>
        </div>
      </section>
      <section class="settings-section">
        <h2>快捷键</h2>
        <div class="setting-row">
          <span>唤醒看板</span>
          <div class="shortcut-control">
            <strong id="shortcutSummary">读取中</strong>
            <button id="shortcutSettingsButton" class="plain-button" type="button">修改</button>
          </div>
        </div>
      </section>
    </section>

    <div id="milestoneDialog" class="milestone-dialog" role="alertdialog" aria-modal="true" aria-labelledby="milestoneDialogTitle" aria-describedby="milestoneDialogMessage" hidden>
      <strong id="milestoneDialogTitle">资产总额提醒</strong>
      <p id="milestoneDialogMessage"></p>
      <button id="milestoneDialogClose" class="plain-button" type="button">知道了</button>
    </div>
  </main>

  <script>
    window.__savedHoldings = null;
    window.__milestoneResponse = [];
    window.__marketRate = 7.2;
    window.__storageData = {};
    window.__storageSessionData = new URLSearchParams(location.search).has('shortcut')
      ? { shortcutPopupCloseAt: Date.now() + 3000 }
      : {};
    window.__closeCalledAt = null;
    window.close = () => {
      window.__closeCalledAt = Date.now();
      document.documentElement.dataset.testClosed = 'true';
    };
    window.chrome = {
      storage: {
        local: {
          get(defaults, callback) { callback({ ...defaults, ...window.__storageData }); },
          set(value) {
            Object.assign(window.__storageData, value);
            window.__savedHoldings = value.holdings;
            window.__savedAssetDefinitions = value.assetDefinitions;
            window.__savedPriceCurrency = value.priceCurrency;
            window.__savedTotalCurrency = value.totalCurrency;
            window.__savedUsdCnyRate = value.usdCnyRate;
          }
        },
        session: {
          get(key) {
            return Promise.resolve({ [key]: window.__storageSessionData[key] });
          },
          set(value) {
            Object.assign(window.__storageSessionData, value);
            return Promise.resolve();
          },
          remove(key) {
            delete window.__storageSessionData[key];
            return Promise.resolve();
          }
        }
      },
      commands: {
        getAll() {
          return Promise.resolve([
            { name: 'open-dashboard', shortcut: 'Alt+G' },
            { name: 'open-dashboard-global', shortcut: 'Ctrl+Shift+7' }
          ]);
        }
      },
      runtime: {
        lastError: null,
        sendMessage(message, callback) {
          window.__lastMessage = message;
          if (message.type === 'CHECK_TOTAL_MILESTONES') {
            callback({ ok: true, crossings: window.__milestoneResponse });
            return;
          }
          if (message.type === 'GET_MARKET_PRICES') {
            window.__marketAssets = message.assets;
            const prices = {
              BGB: 1.9,
              AAPL: 250,
              GOOGL: 200,
              NVDA: 180
            };
            if (Number.isFinite(window.__marketRate)) prices['CNY=X'] = window.__marketRate;
            const resolvedTypes = {
              BGB: 'crypto',
              AAPL: 'stock',
              GOOGL: 'stock',
              NVDA: 'stock'
            };
            if (message.assets?.some(asset => asset.symbol === 'TSLA')) {
              prices.TSLA = 300;
              resolvedTypes.TSLA = 'stock';
            }
            callback({
              ok: true,
              prices,
              resolvedTypes
            });
            return;
          }
          const prices = { AAPL: 250, GOOGL: 200, NVDA: 180, 'CNY=X': 7.2 };
          if (message.symbols?.includes('TSLA')) prices.TSLA = 300;
          callback({ prices, errors: [] });
        }
      },
      tabs: {
        create(options) {
          window.__createdTab = options;
          return Promise.resolve(options);
        }
      }
    };
    window.fetch = async function mockFetch() {
      return {
        ok: true,
        async json() {
          return {
            data: [
              { instId: 'BTC-USDT', last: '100000' },
              { instId: 'ADA-USDT', last: '0.75' },
              { instId: 'OKB-USDT', last: '50' },
              { instId: 'PAXG-USDT', last: '2500' },
              { instId: 'BNB-USDT', last: '600' },
              { instId: 'TRX-USDT', last: '0.35' }
            ]
          };
        }
      };
    };
  </script>
  <script src="../portfolio.js"></script>
  <script src="../popup.js"></script>
</body>
</html>
